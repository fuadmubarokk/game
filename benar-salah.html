<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benar Salah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
:root{
  --bg:#DDEFE3;
  --paper:#FBFDF7;
  --ink:#1D3528;
  --muted:#557261;
  --line:#B9D6C3;
  --sun:#FFC93C;
  --a:#2A74C9;
  --b:#F29A2E;
  --ok:#2E9E5B;
  --ok-soft:#D4F1DF;
  --bad:#D2433A;
  --bad-soft:#FADAD7;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(14px,1.5vmin + 6px,22px);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,a.btn{font-family:var(--display);font-weight:800;cursor:pointer;border:0;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow:auto;padding:16px;z-index:20;background:var(--bg)}
.intro h1{font-family:var(--display);font-size:clamp(40px,8vmin,104px);line-height:.95;margin:0}
.intro h1 .a{color:var(--ok)}
.intro h1 .b{color:var(--bad)}
.intro p{max-width:42em;margin:0;color:var(--muted);text-wrap:balance}
.setup{background:var(--paper);border-radius:28px;padding:clamp(16px,3vmin,32px);display:grid;gap:14px;width:min(100%,920px);box-shadow:0 6px 0 var(--line)}
.topic{font-family:var(--display);font-weight:800;font-size:1.1em;color:var(--ink)}
.topic small{display:block;font-family:var(--body);font-weight:700;color:var(--muted);font-size:.7em}
.opts-row{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;align-items:center}
.optlabel{font-weight:700;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center}
.seg button{padding:8px 16px;border-radius:999px;background:transparent;font-size:.95em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.big{font-size:clamp(22px,3.2vmin,40px);padding:.45em 1.4em;border-radius:999px;background:var(--sun);box-shadow:0 6px 0 #D9A21C}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A21C}
.btn{font-size:1em;padding:.5em 1.2em;border-radius:999px;background:var(--paper);box-shadow:0 5px 0 var(--line);border:2px solid var(--line);text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:.85em}
.msg{color:var(--bad);font-weight:700}

.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,#BFE3F5,#DDEFE3)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.half{position:absolute;top:0;bottom:0;width:50%;transition:background .3s;pointer-events:none}
.half.l{left:0;background:rgba(42,116,201,.12)}
.half.r{right:0;background:rgba(242,154,46,.12)}
.half.ok{background:rgba(46,158,91,.5)}
.half.no{background:rgba(210,67,58,.5)}
.mid{position:absolute;top:0;bottom:0;left:50%;border-left:6px dashed rgba(251,253,247,.95);transform:translateX(-3px);pointer-events:none;filter:drop-shadow(0 0 3px rgba(0,0,0,.35))}

.qcard{position:absolute;top:clamp(8px,1.6vh,18px);left:50%;transform:translateX(-50%);width:min(66vw,1100px);background:rgba(251,253,247,.96);border-radius:24px;padding:clamp(8px,1.4vh,14px) clamp(14px,2vw,26px);box-shadow:0 6px 0 rgba(29,53,40,.25);z-index:5;display:flex;gap:clamp(10px,1.6vw,22px);align-items:center}
.qcard .pic{flex:none;width:clamp(140px,18vw,300px);aspect-ratio:320/210;border-radius:16px;overflow:hidden}
.qcard .pic svg{width:100%;height:100%;display:block}
.qcard .txt{flex:1;text-align:center;min-width:0}
.qcard small{display:block;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:clamp(11px,1.4vmin,16px)}
.qcard .qt{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.8vmin,48px);line-height:1.12;text-wrap:balance}
.timer{position:absolute;top:clamp(10px,1.8vh,20px);left:clamp(10px,1.4vw,20px);width:clamp(72px,11vmin,140px);height:clamp(72px,11vmin,140px);border-radius:50%;background:conic-gradient(var(--ok) calc(var(--t,1)*1turn),rgba(251,253,247,.6) 0);display:grid;place-items:center;z-index:6;box-shadow:0 5px 0 rgba(29,53,40,.25)}
.timer.low{background:conic-gradient(var(--bad) calc(var(--t,1)*1turn),rgba(251,253,247,.6) 0)}
.timer b{width:78%;height:78%;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:clamp(28px,5.5vmin,66px);line-height:1}

.opt{position:absolute;bottom:clamp(12px,3vh,36px);display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);max-width:44vw;background:rgba(251,253,247,.96);border-radius:24px;padding:clamp(10px,1.6vh,18px) clamp(14px,1.6vw,26px) clamp(10px,1.6vh,18px) clamp(10px,1.2vw,16px);box-shadow:0 6px 0 rgba(29,53,40,.25);z-index:5;border:5px solid transparent;transition:border-color .3s,background .3s}
.opt.a{left:clamp(12px,1.6vw,30px)}
.opt.b{right:clamp(12px,1.6vw,30px);flex-direction:row-reverse;padding:clamp(10px,1.6vh,18px) clamp(10px,1.2vw,16px) clamp(10px,1.6vh,18px) clamp(14px,1.6vw,26px);text-align:right}
.opt .k{flex:none;width:clamp(56px,8.5vmin,110px);height:clamp(56px,8.5vmin,110px);border-radius:20px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(34px,6vmin,76px);color:#fff;background:var(--a)}
.opt.b .k{background:var(--b)}
.opt .tx{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vmin,46px);line-height:1.08;text-wrap:balance;min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad)}

.answer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:clamp(40px,9vmin,120px);line-height:1;color:#fff;background:rgba(29,53,40,.85);padding:.15em .6em;border-radius:24px;z-index:7;animation:pop .45s;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.ctrl{position:absolute;left:50%;bottom:clamp(12px,3vh,36px);transform:translateX(-50%);display:flex;gap:8px;z-index:6;flex-wrap:wrap;justify-content:center;max-width:20vw}
.ctrl button{background:var(--ok);color:#fff;border-radius:999px;padding:.5em 1.2em;font-size:clamp(14px,1.8vmin,22px);box-shadow:0 4px 0 #1E6E3F}
.ctrl button.sec{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ctrl button[hidden],.ctrl .auto[hidden]{display:none}
.ctrl .auto{background:rgba(29,53,40,.85);color:#fff;border-radius:999px;padding:.5em 1.2em;font-family:var(--display);font-weight:800;font-size:clamp(14px,1.8vmin,22px);white-space:nowrap}
.tools{position:absolute;top:clamp(8px,1.6vh,18px);right:clamp(8px,1.4vw,18px);display:flex;flex-direction:column;gap:6px;z-index:6}
.ic{background:var(--paper);border-radius:12px;padding:6px 12px;font-size:.72em;color:var(--muted)}

.ov{position:fixed;inset:0;background:rgba(29,53,40,.5);display:grid;place-items:center;z-index:40;padding:16px}
.ovbox{background:var(--paper);border-radius:28px;padding:clamp(18px,3vmin,36px);width:min(100%,760px);display:grid;gap:14px;text-align:center;animation:popbox .4s}
.ovbox h2{font-family:var(--display);font-size:clamp(30px,6vmin,72px);line-height:1;margin:0}
@keyframes popbox{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}

.editor{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.ehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--paper);box-shadow:0 4px 0 var(--line)}
.ehead h2{font-family:var(--display);margin:0;font-size:1.4em}
.ehead label{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);flex:1 1 360px}
.ehead input{flex:1;font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);min-width:0}
.elist{flex:1;overflow:auto;padding:14px 18px;display:grid;gap:10px;align-content:start}
.eq{background:var(--paper);border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;border:2px solid var(--line)}
.eq .no{font-family:var(--display);font-weight:800;font-size:1.2em;color:var(--muted);grid-row:span 2;align-self:start}
.eq textarea,.eq input{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);width:100%;min-width:0;resize:vertical}
.eq .opts{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center}
.eq .key{display:flex;gap:4px;align-items:center;font-weight:700;color:var(--muted);font-size:.85em}
.eq .key button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:1em}
.eq .key button[aria-pressed="true"]{background:var(--ok);color:#fff}
.eq .del{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:.85em}
.eq .tag{font-size:.75em;color:var(--muted);font-weight:700}
.efoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;background:var(--paper);box-shadow:0 -4px 0 var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.qcard{width:94vw;flex-direction:column;top:110px}.opt{max-width:46vw}.eq .opts{grid-template-columns:1fr}.ctrl{max-width:90vw;bottom:auto;top:50%}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="cam" playsinline muted></video>
  <div class="half l" id="hl"></div>
  <div class="half r" id="hr"></div>
  <div class="mid"></div>
</div>
<div id="ui"></div>

<script>
const SK='#E9B98E';
function kid(x,y,k,shirt,pants,head,armL,armR,legs){
  const lg={stand:'M-9 -40 L-11 0 M9 -40 L11 0',kick:'M-9 -40 L-14 0 M9 -40 L34 -22'}[legs||'stand'];
  const hd={hijab:`<path d="M-24 -118 Q-26 -152 0 -154 Q26 -152 24 -118 L28 -92 Q0 -82 -28 -92Z" fill="#7FB3D5"/><circle cx="0" cy="-122" r="17" fill="${SK}"/>`,
    boy:`<circle cx="0" cy="-122" r="21" fill="${SK}"/><path d="M-21 -126 Q-20 -148 2 -146 Q22 -146 21 -126 Q10 -136 -21 -126Z" fill="#2B2320"/>`,
    mom:`<path d="M-25 -118 Q-27 -154 0 -156 Q27 -154 25 -118 L30 -88 Q0 -78 -30 -88Z" fill="#C0577A"/><circle cx="0" cy="-122" r="18" fill="${SK}"/>`}[head];
  return `<g transform="translate(${x} ${y}) scale(${k})"><path d="${lg}" stroke="${pants}" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M-12 0 h-6 M12 0 h6" stroke="#2B2320" stroke-width="7" stroke-linecap="round"/><path d="M-20 -40 L-17 -94 Q0 -102 17 -94 L20 -40Z" fill="${shirt}"/><path d="M-15 -90 ${armL}" stroke="${shirt}" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M15 -90 ${armR}" stroke="${shirt}" stroke-width="10" stroke-linecap="round" fill="none"/>${hd}<circle cx="-7" cy="-124" r="2.4" fill="#2B2320"/><circle cx="7" cy="-124" r="2.4" fill="#2B2320"/><path d="M-6 -114 Q0 -109 6 -114" stroke="#2B2320" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
}
const tag=(t)=>`<rect x="10" y="10" width="${t.length*11+24}" height="30" rx="15" fill="#FBFDF7"/><text x="22" y="31" font-family="Baloo 2,sans-serif" font-weight="800" font-size="18" fill="#A13F63">${t}</text>`;
const flower=(x,y,c)=>`<path d="M${x} ${y} V${y-26}" stroke="#3E7F30" stroke-width="4"/><circle cx="${x}" cy="${y-30}" r="9" fill="${c}"/><circle cx="${x}" cy="${y-30}" r="3.5" fill="#FFD23F"/>`;
const SV=(b,bg)=>`<svg viewBox="0 0 320 210" aria-hidden="true"><rect width="320" height="210" fill="${bg}"/>${b}</svg>`;
const ART={
  siram:SV('<rect y="160" width="320" height="50" fill="#8CC56A"/>'+[[190,'#E2483D'],[220,'#F29A2E'],[250,'#C0577A'],[280,'#E2483D']].map(([x,c])=>flower(x,172,c)).join('')+kid(110,176,1,'#F29A2E','#5D6B78','hijab','L-30 -64','L44 -70')+'<g transform="translate(150 98)"><path d="M0 0 h34 l6 18 h-46Z" fill="#2E9E5B"/><path d="M34 4 L64 -6" stroke="#2E9E5B" stroke-width="6" stroke-linecap="round"/>'+[0,1,2].map(i=>`<path d="M${66+i*4} ${-2+i*6} l${6+i} 16" stroke="#3B9BE0" stroke-width="3" stroke-linecap="round"/>`).join('')+'</g>'+tag('Dayu'),'#D8F0FB'),
  bola:SV('<rect y="150" width="320" height="60" fill="#7FBF5A"/><path d="M230 70 h70 v84 M230 70 v84" stroke="#fff" stroke-width="6" fill="none"/>'+kid(110,168,1,'#2A74C9','#1D3528','boy','L-34 -62','L36 -60','kick')+'<circle cx="168" cy="140" r="14" fill="#fff" stroke="#1D3528" stroke-width="3"/>'+tag('Raka'),'#CFEAF8'),
  masak:SV('<rect x="0" y="120" width="320" height="90" fill="#E7C9A0"/><rect x="170" y="110" width="130" height="90" rx="8" fill="#B8BEC6"/><rect x="186" y="100" width="40" height="10" rx="3" fill="#434A52"/><rect x="242" y="100" width="40" height="10" rx="3" fill="#434A52"/><ellipse cx="206" cy="92" rx="30" ry="9" fill="#2B2320"/><path d="M236 92 h34" stroke="#2B2320" stroke-width="6" stroke-linecap="round"/><circle cx="196" cy="88" r="5" fill="#5E9C3E"/><circle cx="212" cy="88" r="5" fill="#E2483D"/>'+kid(120,196,1.15,'#C0577A','#6B4A5A','mom','L-26 -60','L52 -86')+tag('Ibu'),'#FDF0DD'),
  baca:SV('<circle cx="270" cy="40" r="20" fill="#FFD23F"/><rect y="160" width="320" height="50" fill="#8CC56A"/><rect x="52" y="70" width="14" height="96" fill="#8A5A34"/><circle cx="59" cy="62" r="40" fill="#5E9C3E"/><circle cx="34" cy="80" r="24" fill="#6DAF3E"/><circle cx="84" cy="78" r="26" fill="#6DAF3E"/><rect x="200" y="140" width="90" height="8" rx="3" fill="#B9844C"/><path d="M208 148 V172 M282 148 V172" stroke="#8A5A34" stroke-width="5"/>'+kid(150,178,1,'#2A74C9','#1D3528','boy','L-6 -66','L6 -66')+'<g transform="translate(150 112)"><path d="M0 0 L-24 -6 L-24 18 L0 24Z" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><path d="M0 0 L24 -6 L24 18 L0 24Z" fill="#fff" stroke="#9fb3c8" stroke-width="2"/></g>'+tag('Beni'),'#CFEAF8'),
};
const DEFAULT_TOPIC='Bahasa Indonesia – Informasi dalam Gambar';
const DEFAULT=[
{img:'siram',q:'Siapa nama anak di gambar?',a:['Dayu','Raka']},
{img:'siram',q:'Dayu sedang ...',a:['menyiram bunga','makan nasi']},
{img:'siram',q:'Apa yang disiram Dayu?',a:['bunga','mobil']},
{img:'siram',q:'Di mana Dayu menyiram bunga?',a:['di taman','di kelas']},
{img:'bola',q:'Siapa nama anak di gambar?',a:['Raka','Beni']},
{img:'bola',q:'Raka sedang ...',a:['menendang bola','membaca buku']},
{img:'bola',q:'Di mana Raka bermain bola?',a:['di lapangan','di dapur']},
{img:'masak',q:'Siapa yang ada di gambar?',a:['Ibu','Adik']},
{img:'masak',q:'Ibu sedang ...',a:['memasak','tidur']},
{img:'masak',q:'Di mana Ibu memasak?',a:['di dapur','di taman']},
{img:'baca',q:'Beni sedang ...',a:['membaca buku','bermain bola']},
{img:'baca',q:'Apa yang dibaca Beni?',a:['buku','koran']},
{img:'baca',q:'Di mana Beni membaca buku?',a:['di taman','di kamar mandi']},
{img:'siram',q:'Kalimat yang cocok dengan gambar adalah ...',a:['Dayu menyiram bunga.','Dayu menendang bola.']},
{img:'bola',q:'Kalimat yang cocok dengan gambar adalah ...',a:['Raka menendang bola.','Raka memasak sayur.']},
{img:'masak',q:'Kalimat yang cocok dengan gambar adalah ...',a:['Ibu memasak di dapur.','Ibu membaca di taman.']},
{img:'baca',q:'Kalimat yang cocok dengan gambar adalah ...',a:['Beni membaca buku.','Beni menyiram bunga.']},
{q:'Sebelum menulis, kita harus ... gambar dengan teliti.',a:['melihat','menutup']},
{q:'Pada gambar, kita melihat tokoh, kegiatan, dan ...',a:['tempat','harga']},
{q:'"Sita membaca buku." Siapa yang membaca?',a:['Sita','buku']},
{q:'"Sita membaca buku." Sita sedang ...',a:['membaca','menulis']},
{q:'"Adik minum susu." Apa yang diminum Adik?',a:['susu','teh']},
{q:'"Ayah mencuci mobil di halaman." Di mana Ayah mencuci mobil?',a:['di halaman','di dapur']},
{q:'"Kakak menyapu lantai." Kakak sedang ...',a:['menyapu','memasak']},
{q:'Kalimat yang lengkap adalah ...',a:['Rina membaca buku.','Membaca buku.']},
{q:'Kalimat diawali dengan huruf ...',a:['besar (kapital)','kecil']},
{q:'Kalimat diakhiri dengan tanda ...',a:['titik ( . )','koma ( , )']},
{q:'Penulisan kalimat yang benar adalah ...',a:['Budi bermain bola.','budi bermain bola']},
{q:'Orang yang melakukan kegiatan dalam kalimat disebut ...',a:['subjek','objek']},
{q:'"Di taman" dalam kalimat menunjukkan ...',a:['tempat','waktu']},
].map((x,i)=>{const swap=i%2===1;return {q:x.q,A:swap?x.a[1]:x.a[0],B:swap?x.a[0]:x.a[1],key:swap?'B':'A',img:x.img||''}});

const STORE='benar-salah-soal-v1',REVEAL=5;
const $=(s,r=document)=>r.querySelector(s);
const ui=$('#ui'),stage=$('#stage'),video=$('#cam');
const shuffle=(a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=(t)=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA={topic:DEFAULT_TOPIC,items:DEFAULT};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&Array.isArray(s.items)&&s.items.length)DATA=s}catch(e){}
let G={total:5,qtime:10,paused:false,revealAt:0,cam:true,sound:true,shuffle:true,deck:[],qi:0,cur:null,state:'idle',qStart:0,left:0,lastBeep:-1};
let audio=null,stream=null,raf=0;

function saveData(){try{localStorage.setItem(STORE,JSON.stringify(DATA))}catch(e){}}
function beep(f,d=.12,type='sine',v=.15){if(!G.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);const t=audio.currentTime;g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={tick:()=>beep(880,.06,'square',.05),reveal:()=>{beep(523,.12);setTimeout(()=>beep(784,.12),120);setTimeout(()=>beep(1047,.25),240)},end:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*150))};

function intro(msg){
  stop();
  const n=DATA.items.length;
  const totals=[5,10,15,20].filter(v=>v<n).concat([n]);
  if(!totals.includes(G.total))G.total=Math.min(10,n);
  ui.innerHTML=`<section class="intro">
    <h1><span class="a">Benar</span> <span class="b">Salah</span></h1>
    <p>Beberapa siswa maju bersama-sama per giliran dan berdiri di depan IFP. Baca soal, lalu <b>pindah ke sisi kiri untuk jawaban A</b> atau <b>sisi kanan untuk jawaban B</b> sebelum waktu habis. Sisi yang benar menjadi hijau, sisi yang salah menjadi merah. Urutan soal dan letak jawaban diacak ulang di setiap giliran.</p>
    <div class="setup">
      <div class="topic">${esc(DATA.topic||'Tanpa judul')}<small>${n} soal tersimpan</small></div>
      <div class="opts-row"><span class="optlabel">Jumlah soal</span>
        <div class="seg" data-k="total">${totals.map(v=>`<button type="button" data-v="${v}" aria-pressed="${G.total===v}">${v===n&&![5,10,15,20].includes(v)?'Semua ('+v+')':v+' soal'}</button>`).join('')}</div></div>
      <div class="opts-row"><span class="optlabel">Waktu per soal</span>
        <div class="seg" data-k="qtime">${[5,10,15,20,30].map(v=>`<button type="button" data-v="${v}" aria-pressed="${G.qtime===v}">${v} detik</button>`).join('')}</div></div>
      <div class="opts-row"><span class="optlabel">Urutan soal</span>
        <div class="seg" data-k="shuffle">${[[1,'Acak'],[0,'Berurutan']].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${+G.shuffle===v}">${l}</button>`).join('')}</div>
        <span class="optlabel">Kamera</span>
        <div class="seg" data-k="cam">${[[1,'Nyala'],[0,'Mati']].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${+G.cam===v}">${l}</button>`).join('')}</div></div>
      ${msg?`<div class="msg">${esc(msg)}</div>`:''}
      <div class="row"><button class="big" id="go" type="button">Mulai!</button><button class="btn" id="edit" type="button">Atur soal</button><a class="btn" href="index.html">Daftar game</a></div>
    </div>
  </section>`;
  ui.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=seg.dataset.k,v=+b.dataset.v;G[k]=(k==='cam'||k==='shuffle')?!!v:v;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
  $('#go').onclick=prepare;
  $('#edit').onclick=editor;
}

function stop(){cancelAnimationFrame(raf);raf=0;G.state='idle';document.querySelector('.ov')?.remove();setHalves('')}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}

async function prepare(){
  if(!G.cam){stopCam();start();return}
  if(!stream){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false});
      video.srcObject=stream;await video.play();
    }catch(e){G.cam=false;intro('Kamera tidak bisa dibuka. Pastikan izin kamera diberikan, atau main dengan kamera mati.');return}
  }
  start();
}

function start(){
  const base=G.shuffle?shuffle(DATA.items):[...DATA.items];
  G.deck=base.slice(0,Math.min(G.total,base.length)).map(x=>Math.random()<.5?{...x}:{...x,A:x.B,B:x.A,key:x.key==='A'?'B':'A'});G.qi=0;
  video.style.display=G.cam?'':'none';
  ui.innerHTML=`<div class="timer" id="tm"><b id="tn"></b></div>
    <div class="qcard"><div class="pic" id="pic" hidden></div><div class="txt"><small id="qn"></small><div class="qt" id="qt"></div></div></div>
    <div class="opt a" id="oA"><span class="k">A</span><span class="tx" id="xA"></span></div>
    <div class="opt b" id="oB"><span class="k">B</span><span class="tx" id="xB"></span></div>
    <div class="ctrl"><button type="button" id="show">Tampilkan jawaban</button><button type="button" class="sec" id="pause">Jeda</button><span class="auto" id="auto" hidden></span></div>
    <div class="tools"><button class="ic" id="snd" type="button">${G.sound?'Suara: nyala':'Suara: mati'}</button><button class="ic" id="fs" type="button">Layar penuh</button><button class="ic" id="menu" type="button">Menu</button></div>`;
  $('#show').onclick=reveal;$('#pause').onclick=togglePause;G.paused=false;
  $('#snd').onclick=()=>{G.sound=!G.sound;$('#snd').textContent=G.sound?'Suara: nyala':'Suara: mati'};
  $('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
  $('#menu').onclick=()=>intro();
  nextQ();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}

function setHalves(win){
  const l=$('#hl'),r=$('#hr');
  l.className='half l'+(win==='A'?' ok':win==='B'?' no':'');
  r.className='half r'+(win==='B'?' ok':win==='A'?' no':'');
}

function nextQ(){
  document.querySelectorAll('.answer').forEach(v=>v.remove());
  setHalves('');
  if(G.qi>=G.deck.length){finish();return}
  const q=G.deck[G.qi];G.qi++;G.cur=q;
  $('#qn').textContent=`Soal ${G.qi} / ${G.deck.length}${DATA.topic?' · '+DATA.topic:''}`;
  $('#qt').textContent=q.q;
  const pic=$('#pic');if(q.img&&ART[q.img]){pic.innerHTML=ART[q.img];pic.hidden=false}else{pic.innerHTML='';pic.hidden=true}
  $('#xA').textContent=q.A;$('#xB').textContent=q.B;
  $('#oA').className='opt a';$('#oB').className='opt b';
  $('#show').hidden=false;$('#auto').hidden=true;
  G.state='play';G.qStart=performance.now();G.lastBeep=-1;
}

function reveal(){
  if(G.state!=='play')return;
  G.state='reveal';
  const k=G.cur.key;
  setHalves(k);
  $('#oA').classList.add(k==='A'?'ok':'no');$('#oB').classList.add(k==='B'?'ok':'no');
  const d=document.createElement('div');d.className='answer';d.textContent='JAWABAN: '+k;ui.appendChild(d);
  sfx.reveal();
  $('#tn').textContent='0';$('#tm').style.setProperty('--t',0);
  $('#show').hidden=true;$('#auto').hidden=false;
  G.revealAt=performance.now();
}
function togglePause(){G.paused=!G.paused;$('#pause').textContent=G.paused?'Lanjutkan':'Jeda'}

let lastNow=0;
function loop(now){
  raf=requestAnimationFrame(loop);
  const dt=lastNow?now-lastNow:0;lastNow=now;
  if(G.paused){G.qStart+=dt;G.revealAt+=dt;return}
  if(G.state==='reveal'){
    const wait=Math.ceil(REVEAL-(now-G.revealAt)/1000);
    $('#auto').textContent=G.qi>=G.deck.length?`Selesai dalam ${Math.max(0,wait)}`:`Soal berikutnya dalam ${Math.max(0,wait)}`;
    if(wait<=0)nextQ();
    return;
  }
  if(G.state!=='play')return;
  const left=Math.max(0,G.qtime-(now-G.qStart)/1000),sec=Math.ceil(left);
  $('#tn').textContent=sec;
  const tm=$('#tm');tm.style.setProperty('--t',left/G.qtime);tm.classList.toggle('low',left<=3);
  if(sec<=3&&sec>0&&sec!==G.lastBeep){G.lastBeep=sec;sfx.tick()}
  if(left<=0)reveal();
}

function finish(){
  G.state='over';sfx.end();setHalves('');
  document.body.insertAdjacentHTML('beforeend',`<div class="ov"><div class="ovbox">
    <h2>Giliran selesai!</h2>
    <p class="hint">${G.deck.length} soal sudah dimainkan.</p>
    <div class="row"><button class="big" id="nextp" type="button">Giliran berikutnya</button><button class="btn" id="back" type="button">Ganti pengaturan</button></div>
  </div></div>`);
  $('#nextp').onclick=()=>{document.querySelector('.ov').remove();start()};
  $('#back').onclick=()=>intro();
}

function editor(){
  let items=DATA.items.map(x=>({...x}));
  const el=document.createElement('div');el.className='editor';
  const draw=()=>{
    $('.elist',el).innerHTML=items.map((x,i)=>`<div class="eq" data-i="${i}">
      <span class="no">${i+1}</span>
      <textarea rows="2" data-f="q" placeholder="Tulis soal">${esc(x.q)}</textarea>
      <div class="opts">
        <input data-f="A" value="${esc(x.A)}" placeholder="Jawaban A">
        <input data-f="B" value="${esc(x.B)}" placeholder="Jawaban B">
        <span class="key">Kunci <button type="button" data-k="A" aria-pressed="${x.key==='A'}">A</button><button type="button" data-k="B" aria-pressed="${x.key==='B'}">B</button></span>
        <button type="button" class="del">Hapus</button>
      </div>
      ${x.img?'<span></span><span class="tag">Soal ini memakai gambar bawaan</span>':''}
    </div>`).join('');
  };
  el.innerHTML=`<div class="ehead"><h2>Atur Soal</h2><label>Judul / mapel <input id="etopic" value="${esc(DATA.topic)}" placeholder="Contoh: IPAS – Siklus Hidup Hewan"></label></div>
    <div class="elist"></div>
    <div class="efoot"><button class="btn" type="button" id="eadd">+ Tambah soal</button><button class="btn" type="button" id="eclear">Hapus semua soal</button><button class="btn" type="button" id="edef">Kembalikan soal bawaan</button><button class="big" type="button" id="esave">Simpan</button><button class="btn" type="button" id="ecancel">Batal</button></div>`;
  document.body.appendChild(el);draw();
  $('.elist',el).addEventListener('input',e=>{const r=e.target.closest('.eq');if(!r||!e.target.dataset.f)return;items[+r.dataset.i][e.target.dataset.f]=e.target.value});
  $('.elist',el).addEventListener('click',e=>{const r=e.target.closest('.eq');if(!r)return;const i=+r.dataset.i;
    if(e.target.dataset.k){items[i].key=e.target.dataset.k;r.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===items[i].key))}
    if(e.target.classList.contains('del')){items.splice(i,1);draw()}});
  $('#eadd',el).onclick=()=>{items.push({q:'',A:'',B:'',key:'A',img:''});draw();const ls=el.querySelectorAll('.eq textarea');ls[ls.length-1].focus()};
  $('#eclear',el).onclick=()=>{if(confirm('Hapus semua soal di daftar ini?')){items=[];draw()}};
  $('#edef',el).onclick=()=>{if(confirm('Ganti semua soal dengan soal bawaan?')){items=DEFAULT.map(x=>({...x}));$('#etopic',el).value=DEFAULT_TOPIC;draw()}};
  $('#ecancel',el).onclick=()=>el.remove();
  $('#esave',el).onclick=()=>{
    const ok=items.map(x=>({q:x.q.trim(),A:x.A.trim(),B:x.B.trim(),key:x.key==='B'?'B':'A',img:x.img||''})).filter(x=>x.q&&x.A&&x.B);
    if(!ok.length){alert('Isi minimal satu soal lengkap (soal, jawaban A, dan jawaban B).');return}
    const skipped=items.length-ok.length;
    DATA={topic:$('#etopic',el).value.trim(),items:ok};saveData();el.remove();
    intro(skipped?`${skipped} soal yang belum lengkap tidak disimpan.`:'');
  };
}

addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key===' '||e.key==='Enter'){if(G.state==='play'){e.preventDefault();reveal()}else if(G.state==='reveal'){e.preventDefault();nextQ()}}if(e.key==='p'||e.key==='P'){if(G.state==='play'||G.state==='reveal')togglePause()}});
intro();
</script>
</body>
</html>
